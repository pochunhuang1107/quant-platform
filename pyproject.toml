[project]
name = "quant-platform"
version = "0.1.0"
description = "Enterprise-grade multi-asset quant research platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
]

[build-system]
requires = [
    "setuptools>=80",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "alembic>=1,<2",
    "mypy>=1.18.2",
    "psycopg[binary]>=3,<4",
    "pytest>=8.4.2",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "live_db: opt-in tests requiring QUANT_RUN_LIVE_DB_TESTS=1, QUANT_TEST_DATABASE_URL, and local live Postgres",
]
pythonpath = [
    "packages/research-sdk/src",
]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
src = [
    "packages/research-sdk/src",
    "tests",
]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.setuptools]
package-dir = {"" = "packages/research-sdk/src"}

[tool.setuptools.packages.find]
where = [
    "packages/research-sdk/src",
]
