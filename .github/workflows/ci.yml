name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy packages/research-sdk/src

      - name: Check JSON Schema exports
        run: uv run python -m research_sdk.contracts.json_schema --output-dir packages/research-sdk/schema --check

      - name: Test
        run: uv run pytest

  postgres-migrations:
    name: Postgres persistence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: quant_platform_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant_test -d quant_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QUANT_RUN_LIVE_DB_TESTS: "1"
      QUANT_TEST_DATABASE_URL: postgresql+psycopg://quant_test:quant_test@127.0.0.1:5432/quant_platform_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run live Postgres persistence smoke tests
        run: >-
          uv run pytest -m live_db
          tests/test_live_postgres_migrations.py
          tests/test_live_postgres_experiment_run_repository.py
          tests/test_live_postgres_data_snapshot_repository.py
          tests/test_live_postgres_research_note_repository.py
          tests/test_live_postgres_review_event_repository.py
          tests/test_live_postgres_artifact_manifest_repository.py
          tests/test_live_postgres_repository_concurrency.py
